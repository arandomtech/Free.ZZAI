<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZZAI // UNCENSORED AI</title>
    
    <!-- Scripts & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050608;
            --panel: rgba(13, 15, 23, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.2);
            --accent-dim: rgba(0, 255, 102, 0.05);
            --danger: #ff4444;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --user-msg-bg: #151824;
            --code-bg: #090a0f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            height: 100dvh;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .ambient-bg {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            top: -300px;
            left: -200px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .layout {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Sidebar Glassmorphism */
        .sidebar {
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 320px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .sidebar { 
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-toggle {
                display: flex !important;
            }
            .sidebar-overlay {
                display: none;
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.6);
                z-index: 99;
            }
            .sidebar-overlay.active {
                display: block;
            }
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 16px var(--accent-glow);
        }

        .brand-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-new-chat {
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 16px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.05);
        }

        .btn-new-chat:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .search-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.8rem;
            width: 100%;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .sidebar-section-title {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .chat-list::-webkit-scrollbar {
            width: 4px;
        }
        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--border);
        }

        .chat-item.active {
            background: rgba(0, 255, 102, 0.08);
            color: var(--accent);
            border-color: rgba(0, 255, 102, 0.3);
            font-weight: 600;
        }

        .chat-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-btn.delete:hover {
            color: var(--danger);
            background: rgba(255, 68, 68, 0.1);
        }

        /* Main Chat Area */
        .main-chat {
            display: flex;
            flex-direction: column;
            height: 100%;
            flex: 1;
            background: transparent;
            min-width: 0;
        }

        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-toggle {
            display: none;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-header .title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 102, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Message Styling */
        .message-wrapper {
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message-sender {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .user {
            align-self: flex-end;
            color: #fff;
            background: var(--user-msg-bg);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            max-width: 80%;
        }

        .ai {
            color: var(--text-main);
            width: 100%;
        }

        .ai p { margin-bottom: 12px; }
        .ai p:last-child { margin-bottom: 0; }

        /* Code Block Styling */
        .code-container {
            margin: 16px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--code-bg);
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .copy-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .copy-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 700;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        pre {
            margin: 0 !important;
            padding: 16px !important;
            background: transparent !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.85rem !important;
            overflow-x: auto;
        }

        /* Input Controls */
        .input-wrapper {
            padding: 20px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
        }

        .input-box {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 0;
            font-family: 'Inter', sans-serif;
            resize: none;
            outline: none;
            max-height: 150px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        button#send {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
        }

        button#send:hover {
            opacity: 0.95;
            box-shadow: 0 0 16px var(--accent-glow);
            transform: translateY(-1px);
        }

        button#send:active {
            transform: translateY(0);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="ambient-bg"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="brand-container">
            <div class="brand">ZZAI // UNCENSORED</div>
            <div class="brand-subtitle">High Performance Intelligence</div>
        </div>
        
        <button class="btn-new-chat" id="newChatBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            NEW CHAT
        </button>

        <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Search chats or messages...">
        </div>

        <div class="sidebar-section-title">YOUR CONVERSATIONS</div>
        <div class="chat-list" id="chatList"></div>
    </aside>
    
    <main class="main-chat">
        <header class="chat-header">
            <div class="header-left">
                <button class="mobile-toggle" id="mobileToggle" title="Toggle Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="title" id="currentChatTitle">ZZAI ENGINE v1.0</div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                ONLINE
            </div>
        </header>

        <div id="history" class="chat-history"></div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="prompt" placeholder="Ask anything..." rows="1"></textarea>
                <button id="send">SEND</button>
            </div>
        </div>
    </main>
</div>

<script>
    const STORAGE_KEY = 'zzai_chats_data';
    
    let chats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentChatId = null;

    const historyEl = document.getElementById('history');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const chatListEl = document.getElementById('chatList');
    const newChatBtn = document.getElementById('newChatBtn');
    const searchInput = document.getElementById('searchInput');
    const sidebar = document.getElementById('sidebar');
    const mobileToggle = document.getElementById('mobileToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    // Auto-resize textarea
    promptEl.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight - 16) + 'px';
    });

    // Mobile Sidebar controls
    function toggleSidebar() {
        sidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('active');
    }

    mobileToggle.onclick = toggleSidebar;
    sidebarOverlay.onclick = toggleSidebar;

    // Search filter listener
    searchInput.addEventListener('input', renderSidebar);

    // Marked.js config
    marked.use({
        renderer: {
            code(token) {
                const codeText = typeof token === 'string' ? token : (token.text || '');
                const language = typeof token === 'object' && token.lang ? token.lang : '';

                const validLang = language && hljs.getLanguage(language) ? language : 'text';
                const highlighted = hljs.highlight(codeText, { language: validLang }).value;
                const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
                
                return `
                    <div class="code-container">
                        <div class="code-header">
                            <span>${validLang.toUpperCase()}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${codeId}', this)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Copy
                            </button>
                        </div>
                        <pre><code id="${codeId}" class="hljs ${validLang}">${highlighted}</code></pre>
                    </div>
                `;
            }
        }
    });

    window.copyToClipboard = function(elementId, btn) {
        const codeElement = document.getElementById(elementId);
        if (!codeElement) return;
        
        navigator.clipboard.writeText(codeElement.innerText).then(() => {
            const originalText = btn.innerHTML;
            btn.innerHTML = `✓ Copied!`;
            btn.style.background = 'var(--accent)';
            btn.style.color = '#000';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = 'transparent';
                btn.style.color = 'var(--text-main)';
            }, 2000);
        });
    };

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    }

    function renderSidebar() {
        chatListEl.innerHTML = '';
        const query = searchInput.value.toLowerCase().trim();

        const filteredChats = chats.filter(chat => {
            if (!query) return true;
            const matchesTitle = chat.title.toLowerCase().includes(query);
            const matchesContent = chat.messages.some(m => 
                m.parts.some(p => p.text.toLowerCase().includes(query))
            );
            return matchesTitle || matchesContent;
        });

        filteredChats.forEach(chat => {
            const chatItem = document.createElement('div');
            chatItem.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
            
            chatItem.innerHTML = `
                <span class="chat-item-title">${chat.title}</span>
                <div class="chat-actions">
                    <button class="icon-btn edit" title="Rename Chat">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                    <button class="icon-btn delete" title="Delete Chat">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>
            `;

            chatItem.querySelector('.chat-item-title').onclick = () => {
                selectChat(chat.id);
                if (window.innerWidth <= 768) toggleSidebar();
            };

            chatItem.querySelector('.edit').onclick = (e) => {
                e.stopPropagation();
                renameChat(chat.id);
            };

            chatItem.querySelector('.delete').onclick = (e) => {
                e.stopPropagation();
                deleteChat(chat.id);
            };

            chatListEl.appendChild(chatItem);
        });
    }

    function createNewChat() {
        const newChat = {
            id: 'chat_' + Date.now(),
            title: 'New Conversation',
            messages: []
        };
        chats.unshift(newChat);
        saveToStorage();
        selectChat(newChat.id);
        if (window.innerWidth <= 768) toggleSidebar();
    }

    function renameChat(id) {
        const chat = chats.find(c => c.id === id);
        if (!chat) return;
        const newName = prompt("Enter a new name for this chat:", chat.title);
        if (newName && newName.trim()) {
            chat.title = newName.trim();
            saveToStorage();
            if (currentChatId === id) {
                document.getElementById('currentChatTitle').innerText = chat.title;
            }
            renderSidebar();
        }
    }

    function selectChat(id) {
        currentChatId = id;
        const activeChat = chats.find(c => c.id === currentChatId);
        document.getElementById('currentChatTitle').innerText = activeChat ? activeChat.title : "ZZAI ENGINE v1.0";
        renderHistory();
        renderSidebar();
    }

    function deleteChat(id) {
        chats = chats.filter(c => c.id !== id);
        saveToStorage();
        if (currentChatId === id) {
            currentChatId = chats.length > 0 ? chats[0].id : null;
        }
        if (currentChatId) {
            selectChat(currentChatId);
        } else {
            renderHistory();
            renderSidebar();
        }
    }

    function renderHistory() {
        historyEl.innerHTML = '';
        const activeChat = chats.find(c => c.id === currentChatId);

        if (!activeChat || activeChat.messages.length === 0) {
            historyEl.innerHTML = `
                <div class="message-wrapper">
                    <div class="message-sender">System</div>
                    <div class="message ai">System initialized. Type a message to start the conversation.</div>
                </div>
            `;
            return;
        }

        activeChat.messages.forEach(msg => {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const isUser = msg.role === 'user';
            const senderName = isUser ? 'You' : 'ZZAI Engine';
            const textContent = msg.parts[0].text;

            wrapper.innerHTML = `
                <div class="message-sender" style="${isUser ? 'align-self: flex-end;' : ''}">${senderName}</div>
                <div class="message ${isUser ? 'user' : 'ai'}"></div>
            `;

            const messageDiv = wrapper.querySelector('.message');
            if (isUser) {
                messageDiv.innerText = textContent;
            } else {
                messageDiv.innerHTML = marked.parse(String(textContent));
            }

            historyEl.appendChild(wrapper);
        });

        historyEl.scrollTop = historyEl.scrollHeight;
    }

    async function process() {
        const queryText = promptEl.value.trim();
        if (!queryText) return;

        if (!currentChatId) {
            createNewChat();
        }

        const activeChat = chats.find(c => c.id === currentChatId);
        activeChat.messages.push({ role: "user", parts: [{ text: queryText }] });

        if (activeChat.messages.length === 1 || activeChat.title === 'New Conversation') {
            activeChat.title = queryText.substring(0, 25) + '...';
        }

        saveToStorage();
        renderHistory();
        renderSidebar();

        promptEl.value = '';
        promptEl.style.height = 'auto';

        // Typing Indicator
        const loadingWrapper = document.createElement('div');
        loadingWrapper.className = 'message-wrapper';
        loadingWrapper.innerHTML = `
            <div class="message-sender">ZZAI Engine</div>
            <div class="message ai">
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        `;
        historyEl.appendChild(loadingWrapper);
        historyEl.scrollTop = historyEl.scrollHeight;

        try {
            // FULL HISTORY TRANSMISSION: Sends the entire sequence of conversations to ensure complete memory context.
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: activeChat.messages })
            });

            const data = await resp.json();

            if (!resp.ok) {
                throw new Error(data.error || `HTTP Error ${resp.status}`);
            }

            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const responseText = typeof rawText === 'string' ? rawText : "No response received.";

            activeChat.messages.push({ role: "model", parts: [{ text: responseText }] });
            saveToStorage();
            renderHistory();

        } catch(e) {
            if (historyEl.contains(loadingWrapper)) {
                historyEl.removeChild(loadingWrapper);
            }
            
            const errorWrapper = document.createElement('div');
            errorWrapper.className = 'message-wrapper';
            errorWrapper.innerHTML = `
                <div class="message-sender">System</div>
                <div class="message ai" style="color: var(--danger);">Error: ${e.message}</div>
            `;
            historyEl.appendChild(errorWrapper);
            activeChat.messages.pop(); // Revert user message on error
            saveToStorage();
        }

        historyEl.scrollTop = historyEl.scrollHeight;
    }

    // Initialization
    if (chats.length > 0) {
        selectChat(chats[0].id);
    } else {
        renderHistory();
        renderSidebar();
    }

    sendBtn.onclick = process;
    newChatBtn.onclick = createNewChat;

    promptEl.onkeydown = (e) => { 
        if (e.key === 'Enter' && !e.shiftKey) { 
            e.preventDefault(); 
            process(); 
        } 
    };
</script>

</body>
</html>
